<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<style>
/* Layout concept: wide screens show a member list beside the workspace; narrow screens show one pane at a time with a back button.
   Color: cool neutrals tinted toward green, one deep-green accent, amber for cautions.
   Type: Noto Sans KR, three weights, tabular numbers in grids. */
:root {

  --panel: #ffffff;
  --field: #f6f8fa; --hlbg: #fff1b3; --hlbd: #ead27a;

  --accent-soft: #e2f5f2;
  --focus: #0a7a6d;
  --warn: #a8630f;
  --warn-soft: #fbf0df;
  --danger: #b3382c;
  --font: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #0e1719; --panel: #152124; --field: #111c1f; --ink: #e5eef0; --ink2: #a4b5bb; --ink3: #6f838a; --hlbg: #4a4210; --hlbd: #b39b1c;
  --line: #26373c; --line2: #1d2c30; --accent: #4db39b; --accent-ink: #06211b; --accent-soft: #17322c;
  --focus: #4db39b; --warn: #e0a052; --warn-soft: #33260f; --danger: #f0857a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h2, h3, h4 { margin: 0; }
.muted { color: var(--ink2); font-size: 13px; }

.app { max-width: 1360px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 72px; }
.topbar { display: flex; align-items: center; gap: 10px; padding-block: 6px 12px; flex-wrap: wrap; }
.brand { cursor: pointer; -webkit-tap-highlight-color: transparent; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; margin-right: auto; }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; min-height: 38px; font-size: 13px; color: var(--ink2); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); }
.pill.ok::before { background: var(--accent); }
.pill.warn::before { background: var(--warn); }
.pill.danger::before { background: var(--danger); }

.btn:hover { border-color: var(--ink3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 13px; }

.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .mitem:focus-visible, .ib:focus-visible, .pill:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.banner.err { color: var(--danger); }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }

}

.layout[data-hide="1"] { grid-template-columns: minmax(0, 1fr); }

.lp-head { display: flex; gap: 8px; margin-bottom: 10px; }

.lbrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.exwrap { margin-bottom: 14px; }

.exlist { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 230px; max-width: min(320px, 86vw); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 8px 24px rgba(20,30,40,.14); display: grid; gap: 2px; }

.seg { display: flex; gap: 2px; background: var(--line2); border-radius: 12px; padding: 4px; margin: 0 0 14px; overflow-x: auto; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }

.dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }

.addrow { margin-top: 8px; }

.sheetbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 580px; padding: 20px; }

details summary { cursor: pointer; color: var(--accent); font-weight: 500; min-height: 36px; display: flex; align-items: center; }

.stat .hlb { position: absolute; top: 6px; right: 6px; min-width: 32px; min-height: 32px; }
.bform { display: grid; gap: 14px; }
.bform .bdate { max-width: 240px; }
.bform .bdate input { width: 100%; min-width: 0; min-height: 52px; font-size: 17px; }
.bnums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

.bform textarea { width: 100%; min-height: 76px; }
.hlnote { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stat .d { font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.chartwrap { overflow-x: auto; margin-top: 4px; }
.chart { display: block; width: 100%; min-width: 520px; height: auto; }
.chart .ch-grid { stroke: var(--line2); stroke-width: 1; }
.chart .ch-line { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .ch-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.chart text { fill: var(--ink3); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart text.ch-val { fill: var(--ink); font-weight: 700; }
.grp { font-size: 12px; font-weight: 700; color: var(--ink2); margin: 14px 0 6px; letter-spacing: 0.02em; }

.exgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }

.exitem:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.sescur { font-weight: 700; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
.sgroup { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 0 12px; margin-bottom: 8px; }

        } catch (e) { toast('열람을 시작하지 못했어요 (' + ((e && e.code) || '오류') + ')'); }
      } }, '열기'), h('button', { class: 'btn', type: 'button', onClick: function () { SPO.openAdmin(); } }, '취소'))));
  }
  paintTabs(); paint();
  adEl.replaceChildren(h('div', { class: 'abox' }, h('div', { class: 'ahead' }, h('h2', null, '관리자'), h('button', { class: 'btn', type: 'button', onClick: function () { adEl.hidden = true; } }, '닫기')), tabs, body));
  adEl.hidden = false;
};
async function enterView(uid, p) {
  var snap = await dbf.collection('users/' + uid + '/notes').get();
  flushAll();
  savedOwn = { members: state.members, settings: state.settings, sel: state.sel, listTab: state.listTab };
  if (state.unsub) { try { state.unsub(); } catch (e) {} state.unsub = null; }
  store = null; window.__ro = true; document.body.classList.add('ro');
  var mem = {};
  snap.docs.forEach(function (d) { if (d.id.indexOf('m_') === 0) { var m = norm(clean(d.data())); mem[m.id] = m; } });
  state.members = mem; state.settings = {}; state.sel = null; state.listTab = 'active'; state.view = 'list'; state.loaded = true; state.mode = 'view';
  adEl.hidden = true;
  roBar.replaceChildren(h('span', null, '열람 모드 · ' + (p.name || p.email || '') + ' · 수정되지 않아요'), h('button', { class: 'btn sm', type: 'button', onClick: exitView }, '나가기'));
  roBar.hidden = false;
  renderAll();
}
function exitView() {
  window.__ro = false; document.body.classList.remove('ro'); roBar.hidden = true;
  if (savedOwn) { state.members = savedOwn.members; state.settings = savedOwn.settings; state.listTab = savedOwn.listTab; savedOwn = null; }
  state.sel = null; state.view = 'list';
  startCloud(dbf, me.uid); renderAll();
}
$('#openFeedback').addEventListener('click', function () { SPO.openFeedback(); });
$('#openGuide').addEventListener('click', function () { SPO.openGuide(); });
$('#openAdmin').addEventListener('click', function () { SPO.openAdmin(); });

  initStandalone();
})();
</script>
